spring.application.name=LogiTract-Service
# ─── SERVER ──────────────────────────────────────────────────
server.port=8088

# ─── CHATIGO BSP ─────────────────────────────────────────────
chatigo.api.base-url=https://api.chatigo.in/v1
chatigo.api-key=cht_live_YOUR_API_KEY_FROM_CHATIGO_DASHBOARD
chatigo.from-number=91XXXXXXXXXX
chatigo.webhook-secret=YOUR_LONG_RANDOM_WEBHOOK_SECRET

# ─── DATABASE ────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/logitrack?useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── SCHEDULING ──────────────────────────────────────────────
spring.task.scheduling.pool.size=4

# ─── LOGGING ─────────────────────────────────────────────────
logging.level.com.logitrack=INFO
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{30} - %msg%n
logging.level.com.example.demo=DEBUG
logging.level.org.hibernate=DEBUG
#logging.level.org.springframework.web=DEBUG

# ─── ACTUATOR ────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
