spring.application.name=chatigo-integration
server.port=8087


# WhatsApp Meta Cloud API Configuration
# Get these from: Meta for Developers > Your App > WhatsApp > API Setup
whatsapp.api.url=https://graph.facebook.com/v19.0
whatsapp.phone-number-id=YOUR_PHONE_NUMBER_ID
whatsapp.access-token=YOUR_ACCESS_TOKEN
whatsapp.verify-token=MY_CUSTOM_VERIFY_TOKEN_123

# Chatigo Configuration (For the ChatigoService)
# Get these from your Chatigo Dashboard
chatigo.api-key=YOUR_CHATIGO_API_KEY
chatigo.phone-number=91XXXXXXXXXX

## security
spring.security.user.name=admin
spring.security.user.password=mypassword123